<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chibi Punch Arena - Login</title>
    <!-- Tailwind CSS untuk tampilan modern -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Poppins:wght@400;600;800&display=swap');
        
        .font-game {
            font-family: 'Luckiest Guy', cursive;
            letter-spacing: 1px;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1a1c29 0%, #16192b 100%);
            color: #fff;
            user-select: none;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col justify-center items-center p-4">

    <!-- Container Utama Card Login -->
    <div class="w-full max-w-md bg-gray-900/90 border border-gray-700/60 backdrop-blur-md p-8 rounded-3xl shadow-2xl flex flex-col items-center text-center">
        
        <!-- Logo / Judul Game -->
        <h1 class="font-game text-4xl md:text-5xl text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 via-orange-500 to-red-500 drop-shadow-[0_4px_4px_rgba(0,0,0,0.8)] mb-2">
            CHIBI PUNCH ARENA
        </h1>
        <p class="text-gray-400 text-sm mb-8">
            Masuk dengan akun Google untuk mulai mabar seru secara real-time!
        </p>

        <!-- Informasi Status Sesi -->
        <div id="auth-status" class="w-full mb-6 hidden flex flex-col items-center bg-gray-800/60 border border-gray-700 p-4 rounded-2xl">
            <img id="user-photo" src="" alt="Avatar" class="w-16 h-16 rounded-full border-2 border-yellow-400 mb-2 shadow-md">
            <span id="user-name" class="font-bold text-white text-base"></span>
            <span id="user-email" class="text-xs text-gray-400 mb-3"></span>
            <button id="btn-play" onclick="goToLobby()" class="w-full font-game bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-400 hover:to-emerald-500 text-white py-2.5 px-4 rounded-xl shadow-lg transition-all transform hover:-translate-y-0.5 border-b-4 border-emerald-800">
                LANJUT KE LOBBY & MABAR!
            </button>
        </div>

        <!-- Tombol Login Google -->
        <button id="btn-google-login" onclick="loginWithGoogle()" class="w-full flex items-center justify-center gap-3 bg-white hover:bg-gray-100 text-gray-800 font-semibold py-3 px-6 rounded-xl shadow-lg transition-all transform hover:-translate-y-0.5 border border-gray-300">
            <svg class="w-5 h-5" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            <span>Masuk dengan Google</span>
        </button>

        <!-- Tombol Logout (Muncul jika sudah login) -->
        <button id="btn-logout" onclick="logoutGoogle()" class="w-full mt-3 hidden text-xs text-red-400 hover:text-red-300 underline font-semibold py-1">
            Keluar / Ganti Akun
        </button>

        <!-- Footer Info -->
        <div class="mt-8 text-xs text-gray-500">
            Chibi Punch Arena &bull; Firebase Connected
        </div>
    </div>

    <!-- SCRIPT FIREBASE & AUTH LOGIC -->
    <script type="module">
        // Import Firebase SDK dari CDN
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // Konfigurasi Firebase dari pengguna
        const firebaseConfig = {
            apiKey: "AIzaSyCDFDowEWLFOjih1DyYjfsS28ZMEnYnd-E",
            authDomain: "gelut-game.firebaseapp.com",
            projectId: "gelut-game",
            storageBucket: "gelut-game.firebasestorage.app",
            messagingSenderId: "845180304656",
            appId: "1:845180304656:web:7c641396674c3b361c7995",
            measurementId: "G-NSMWXE7KZV"
        };

        // Inisialisasi Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // Fungsi Login dengan Google
        window.loginWithGoogle = function() {
            signInWithPopup(auth, provider)
                .then((result) => {
                    console.log("Login Berhasil:", result.user.displayName);
                })
                .catch((error) => {
                    console.error("Gagal Login:", error.message);
                    alert("Gagal login dengan Google: " + error.message);
                });
        };

        // Fungsi Logout
        window.logoutGoogle = function() {
            signOut(auth).then(() => {
                console.log("Berhasil keluar");
            }).catch((error) => {
                console.error("Gagal keluar:", error);
            });
        };

        // Pantau Status Autentikasi Pengguna Secara Real-time
        onAuthStateChanged(auth, (user) => {
            const loginBtn = document.getElementById('btn-google-login');
            const authStatus = document.getElementById('auth-status');
            const logoutBtn = document.getElementById('btn-logout');

            if (user) {
                // Jika sudah login
                loginBtn.classList.add('hidden');
                authStatus.classList.remove('hidden');
                logoutBtn.classList.remove('hidden');

                document.getElementById('user-photo').src = user.photoURL || 'https://via.placeholder.com/150';
                document.getElementById('user-name').innerText = user.displayName;
                document.getElementById('user-email').innerText = user.email;

                // Simpan data user ke localStorage agar bisa diakses di halaman game nantinya
                localStorage.setItem('chibi_user', JSON.stringify({
                    uid: user.uid,
                    name: user.displayName,
                    photo: user.photoURL
                }));
            } else {
                // Jika belum login
                loginBtn.classList.remove('hidden');
                authStatus.classList.add('hidden');
                logoutBtn.classList.add('hidden');
                localStorage.removeItem('chibi_user');
            }
        });

        // Pindah ke halaman Lobby / Game Room berikutnya
        window.goToLobby = function() {
            // Nanti file game mabar bisa kita arahkan ke file selanjutnya (misal: room.html atau game.html)
            window.location.href = "room.html"; 
        };
    </script>
</body>
</html>
